<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>World English 2 문법 능력평가</title>
<style>
:root{
  --bg:#f5f6f3; --card:#fff; --ink:#15181d; --dim:#5b6472; --line:#dfe3ea;
  --acc:#1d4ed8; --acc2:#eef2ff; --ok:#15803d; --ok2:#ecfdf5; --no:#b91c1c; --no2:#fef2f2;
  --warn:#b45309; --warn2:#fffbeb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}   /* 당겨서 새로 고침을 막는다(시험 중 실수로 새로 고침 → 이탈) */
body{background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:calc(16px*var(--fz,1));line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:calc(19px*var(--fz,1));margin:0}
h1 small{display:block;font-size:calc(13px*var(--fz,1));color:var(--dim);font-weight:400;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card.warn{border-color:#fcd34d;background:var(--warn2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=password],select{flex:1;min-width:120px;font:inherit;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)}
input.code{font-family:ui-monospace,Menlo,monospace;font-size:calc(22px*var(--fz,1));letter-spacing:3px;text-align:center;text-transform:uppercase}
button{font:inherit;font-weight:600;padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{background:#c7cdd8;cursor:default}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.small{padding:8px 12px;font-size:calc(14px*var(--fz,1))}
.muted{color:var(--dim);font-size:calc(14px*var(--fz,1))}
.logo{display:block;height:34px;width:auto;margin:0 0 10px}
.by{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:calc(13px*var(--fz,1));color:var(--dim)}
.by b{color:var(--ink);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(245,246,243,.95);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .wrap{padding:0;display:flex;gap:8px;align-items:center}
.bar button{flex:1}
.clockbar{position:sticky;top:0;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.clock{font-family:ui-monospace,Menlo,monospace;font-size:calc(24px*var(--fz,1));font-weight:700;letter-spacing:1px}
.clock.hot{color:var(--no)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.no{background:var(--acc);color:#fff;border-radius:999px;font-size:calc(12.5px*var(--fz,1));font-weight:700;padding:2px 10px}
.tag{font-size:calc(12.5px*var(--fz,1));color:var(--dim)}
.stem{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;font-size:calc(19px*var(--fz,1));line-height:1.7;margin:2px 0 12px}
.stem u{text-decoration:none;border-bottom:2px solid var(--ink);padding:0 22px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  margin:6px 0;background:#fff;cursor:pointer;font-family:'Malgun Gothic','Noto Sans KR',sans-serif;font-size:calc(17px*var(--fz,1))}
label.opt input{margin:4px 0 0}
label.opt.pick{border-color:var(--acc);background:var(--acc2)}
label.opt.right{border-color:var(--ok);background:var(--ok2)}
label.opt.wrong{border-color:var(--no);background:var(--no2)}
.mark{font-weight:700;font-size:calc(14px*var(--fz,1));font-family:'Malgun Gothic',system-ui,sans-serif}
.mark.o{color:var(--ok)} .mark.x{color:var(--no)}
.ex{margin-top:8px;padding:10px 12px;background:#f8fafc;border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
  font-size:calc(14px*var(--fz,1));color:#334155}
.big{text-align:center;padding:22px 16px}
.big .n{font-size:calc(44px*var(--fz,1));font-weight:800;letter-spacing:-1px}
.big.pass .n{color:var(--ok)} .big.fail .n{color:var(--no)}
.big .m{font-size:calc(15px*var(--fz,1));color:var(--dim);margin-top:4px}
.codebox{text-align:center;padding:16px;background:#0f172a;color:#fff;border-radius:14px;margin:12px 0}
.codebox .c{font-family:ui-monospace,Menlo,monospace;font-size:calc(38px*var(--fz,1));font-weight:800;letter-spacing:4px;line-height:1.25}
.codebox .s{font-size:calc(13px*var(--fz,1));color:#94a3b8;margin-top:6px}
pre.msg{white-space:pre-wrap;word-break:break-all;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;
  font-size:calc(14px*var(--fz,1));font-family:ui-monospace,Menlo,monospace;margin:10px 0 0}
textarea{width:100%;min-height:110px;font:inherit;font-size:calc(14px*var(--fz,1));padding:10px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:calc(14px*var(--fz,1));margin-top:8px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:#f1f5f9}
tr.bad td{background:var(--no2)}
tr.absent td{background:#f8fafc;color:var(--dim)}
.tabs{display:flex;gap:6px;margin-bottom:4px}
.tabs button{flex:1;background:#fff;color:var(--dim);border:1px solid var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.set{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px;background:#fff;font-size:calc(14px*var(--fz,1))}
.chip input{width:54px;font:inherit;font-size:calc(16px*var(--fz,1));padding:6px 4px;border:1px solid var(--line);border-radius:8px;text-align:center;background:#fff}
.chip.lv0{border-color:#86efac} .chip.lv1{border-color:#93c5fd} .chip.lv2{border-color:#fca5a5}
.hide{display:none!important}
a.link{color:var(--acc);font-size:calc(13px*var(--fz,1));cursor:pointer;text-decoration:underline}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kpi div{flex:1;min-width:84px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;font-size:calc(13px*var(--fz,1))}
.kpi b{display:block;font-size:calc(22px*var(--fz,1))}
/* 이탈 방지(2026-11-11): 시험 화면은 글자를 고를 수 없고, 화면을 벗어난 동안에는 문제를 가린다 */
#quiz{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.away #qs{visibility:hidden}
.guardline{font-size:calc(12.5px*var(--fz,1));color:var(--dim)}
.guardline.hot{color:var(--no);font-weight:700}
#cover{position:fixed;inset:0;z-index:2000;background:#0f172a;color:#fff;display:flex;align-items:center;
  justify-content:center;padding:24px;text-align:center}
#cover .in{max-width:440px}
#cover .t{display:block;font-size:calc(22px*var(--fz,1));font-weight:800;margin-bottom:10px}
#cover p{margin:8px 0;font-size:calc(16px*var(--fz,1));color:#e2e8f0}
#cover p b{color:#fde68a}
#cover button{margin-top:16px;width:100%}
#cover button.ghost{margin-top:8px;background:transparent;color:#cbd5e1;border-color:#475569}
label.pledge{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:#fff;cursor:pointer;font-size:calc(15px*var(--fz,1))}
label.pledge input{margin:5px 0 0}
tr.out td{background:var(--no2);color:var(--no);font-weight:700}
@media print{#quiz{display:none!important}}
</style>
<!--LEESS-GATE2--><script src="/leess/roster.js"></script><script src="/leess/gate.js"></script><style id="ipadCss">
/* 아이패드 기준 화면(2026-11-09) — 폭 740px 이상(아이패드 세로·가로, 컴퓨터)에서 본문 폭을 넓히고 글자를 키운다. 휴대폰은 그대로. */
@media (min-width:740px) and (min-height:560px){
:root{--fz:1.19}
.wrap{max-width:1100px!important}
.wrap{padding-left:26px!important;padding-right:26px!important}
.brand img{max-width:640px!important}
input[type=radio],input[type=checkbox]{width:19px;height:19px}
.lock,.gate{max-width:600px!important}
#pwaSheet .pwa-box{max-width:620px!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="card" style="padding:14px 16px">
    <img id="logo" class="logo hide" alt="">
    <h1 id="appTitle"><small id="appSub"></small></h1>
    <div class="by" id="appBy"></div>
  </header>

  <!-- ───────── 학생: 대기 화면 ───────── -->
  <section id="home">
    <div class="card warn">
      <b>대기 중입니다</b>
      <p class="muted" style="margin:6px 0 0">교수님이 <b>시험 코드</b>를 알려주시면 아래에 입력하세요.
        코드를 넣기 전에는 문제가 나오지 않습니다.</p>
    </div>
    <div class="card">
      <div class="row"><input type="text" id="name" placeholder="이름 (필수)" autocomplete="off"></div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="code" class="code" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off"
               autocapitalize="characters" spellcheck="false"></div>
      <p class="muted" id="codeMsg" style="margin:8px 0 0"></p>
    </div>
    <div class="card">
      <b>시험 중 지킬 것</b>
      <p class="muted" id="pledgeText" style="margin:6px 0 10px"></p>
      <label class="pledge"><input type="checkbox" id="pledge">
        <span>확인했습니다. 시험이 끝날 때까지 이 화면을 벗어나지 않겠습니다.</span></label>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <b>내 응시 기록</b>
        <span></span>
      </div>
      <div id="myLog" class="muted" style="margin-top:6px">아직 기록이 없습니다.</div>
    </div>
  </section>

  <!-- ───────── 학생: 시험 ───────── -->
  <section id="quiz" class="hide">
    <div class="clockbar">
      <div><b id="quizWho"></b><div class="muted" id="quizSub"></div><div class="guardline" id="guardLine"></div></div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div id="qs"></div>
  </section>

  <!-- ───────── 학생: 제출 완료(종료 대기) ───────── -->
  <section id="waitEnd" class="hide">
    <div class="card big"><div class="n" id="waitClock">--:--</div>
      <div class="m">제출되었습니다. <b>시험 종료 시각</b>이 되면 점수와 해설이 열립니다.<br>
        그때까지 이 화면을 그대로 두세요.</div></div>
    <div class="card warn hide" id="waitNote"></div>
    <div class="card"><div class="muted" id="waitInfo"></div></div>
  </section>

  <!-- ───────── 학생: 결과 ───────── -->
  <section id="result" class="hide">
    <div class="card big" id="scoreCard"><div class="n" id="scoreN"></div><div class="m" id="scoreM"></div></div>
    <div class="card"><p class="muted" style="margin:0">채점은 서버에서 이루어졌고, 결과는 <b>교수님께 자동으로 전송</b>되었습니다.
      따로 보내실 필요가 없습니다.</p></div>
    <div id="review"></div>
  </section>

  
</div>

<div id="cover" class="hide"><div class="in"><span class="t" id="coverT"></span><p id="coverM"></p>
  <button id="coverGo" class="hide"></button><button id="coverNo" class="ghost hide"></button></div></div>
<div class="bar"><div class="wrap" id="barIn"></div></div>

    if (u[k] < FRAMES[k]) { u[k]++; rest--; }

const cfgSum = a => a.reduce((x, y) => x + (+y || 0), 0);
const cfgLabel = cfg => Object.keys(cfg.u).map(Number).sort((a, b) => b - a).filter(k => cfg.u[k] > 0)
  .map(k => `U${k} ${cfg.u[k]}`).join(' · ') + ' / ' + LV.map((t, i) => t + (cfg.l[i] || 0)).join(' ');

/* ── 출제: 코드(단원·시드)와 배분(cfg)만으로 정해진다 — 반 전체가 같은 문제 ─
   · 단원별 몫은 그대로 지킨다(오늘 단원부터).
   · 난이도 몫은 목표다: 슬롯마다 가장 많이 남은 난이도를 먼저 찾고, 그 단원에 없으면 다른 난이도로 채운다.
     못 채운 만큼은 short.l 에 남는다(교수 화면이 미리 알려 준다).
   · 같은 문장 틀의 변형은 한 회에 하나만. 갈래(Lesson A/C)는 고르게. */
function examItems(unit, seed, cfg) {
  cfg = cfg || defaultCfg(unit, N_DEF);
  const rnd = mulberry32(hashNum('E|' + unit + '|' + seed + '|' + D.salt) >>> 0);
  const picked = [], usedFrame = new Set(), short = { u: {}, l: [0, 0, 0] };
  const left = [0, 1, 2].map(i => Math.max(0, +(cfg.l || [])[i] || 0));
  const units = Object.keys(cfg.u).map(Number).filter(k => D.items[k]).sort((a, b) => b - a);
  const N = Math.min(20, Math.max(1, cfgSum(units.map(k => cfg.u[k]))));
  const X = new Set(cfg.x || []);                      // 앞 회차에 이미 낸 문장 틀(2026-11-11) — 교수 화면이 시험을 열 때 정해 넣는다
  const free = it => !usedFrame.has(frameOf(it.id)) && !X.has(frameOf(it.id)) && !picked.includes(it);
  const take = it => { picked.push(it); usedFrame.add(frameOf(it.id)); };
  units.forEach(k => {
    const want = Math.max(0, Math.min(FRAMES[k], +cfg.u[k] || 0));
    const pool = shuf(D.items[k], rnd), partCnt = {};
    let got = 0;
    for (let s = 0; s < want && picked.length < N; s++) {
      const order = [1, 0, 2].sort((a, b) => left[b] - left[a] || [1, 0, 2].indexOf(a) - [1, 0, 2].indexOf(b));
      let hit = null;
      for (const lv of order) {
        const cands = pool.filter(it => it.lv === lv && free(it));
        if (!cands.length) continue;
        cands.sort((a, b) => (partCnt[a.part] || 0) - (partCnt[b.part] || 0));
        hit = cands[0]; if (left[lv] > 0) left[lv]--; break;
      }
      if (!hit) break;
      take(hit); partCnt[hit.part] = (partCnt[hit.part] || 0) + 1; got++;
    }
    if (got < want) short.u[k] = want - got;
  });
  if (picked.length < N) {                             // 어느 단원이 모자라면 범위 안에서 마저 채운다(최후 보루)
    for (const it of shuf(rangeOf(unit).flatMap(k => D.items[k]), rnd)) {
      if (picked.length >= N) break;
      if (free(it)) take(it);
    }
  }
  if (picked.length < N && X.size) {                   // 그래도 모자라면 이미 낸 틀에서라도 채운다(문제 수는 지킨다)
    for (const it of shuf(rangeOf(unit).flatMap(k => D.items[k]), rnd)) {
      if (picked.length >= N) break;
      if (!usedFrame.has(frameOf(it.id)) && !picked.includes(it)) take(it);
    }
  }
  short.l = left;                                      // 끝까지 못 채운 난이도 몫
  return { items: picked.slice(0, N), short };
}
/* 문제 순서는 반 전체가 같고(교수님이 「3번」으로 설명하실 수 있게), 보기 순서만 학생마다 다르다 */
function paperFor(items, name, code) {
  const rnd = mulberry32(hashNum(name.trim() + '@' + code + '|' + D.salt) >>> 0);
  const qs = items.map(it => {
    const perm = shuf([0, 1, 2, 3], rnd);
    return { id: it.id, u: it.u, part: it.part, point: it.point, lv: it.lv, q: it.q, ex: it.ex,
             opts: perm.map(i => it.opts[i]), ans: perm.indexOf(it.ans) };
  });
  const cap = Math.ceil(qs.length / 4) + 1;            // 정답이 한 자리에 몰리지 않게
  for (let p = 0; p < 12; p++) {
    const h = [0, 0, 0, 0]; qs.forEach(q => h[q.ans]++);
    const hi = h.indexOf(Math.max(...h)), lo = h.indexOf(Math.min(...h));
    if (h[hi] <= cap) break;
    const q = qs.find(x => x.ans === hi);
    [q.opts[hi], q.opts[lo]] = [q.opts[lo], q.opts[hi]]; q.ans = lo;
  }
  return qs;
}

const SRV = D.server_url || '';
async function post(act, body) {
  if (!SRV) throw new Error('채점 서버 주소가 설정되어 있지 않습니다.');
  const r = await fetch(SRV, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                               body: JSON.stringify(Object.assign({ act: act }, body)) });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error('서버 응답을 읽지 못했습니다.'); }
  if (!j.ok) {
    if (D.role === 'teacher' && /비밀번호/.test(j.msg || '')) { store.del('auth'); store.del('pinText'); }   // 비밀번호가 바뀌었으면 다시 묻는다
    if (/알 수 없는 요청/.test(j.msg || '')) throw new Error('채점 서버가 옛 버전입니다. Apps Script 「새 버전 배포」가 필요합니다.');
    throw new Error(j.msg || '서버가 요청을 거절했습니다.');
  }

}

    return t + (el.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function hash(s) { let a = 2166136261, b = 5381; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = (Math.imul(b, 33) + c) | 0; } return (a >>> 0).toString(36) + (b >>> 0).toString(36); }
  const sigs = new WeakMap();
  function ident(el, kind) {   // {id, …} — 글 카드는 내용이 그대로면 다시 계산하지 않는다
    if (kind === 'book') return {id: `${SALT}:${PAGE}:${(location.hash.match(/^#g(\d+)/) || [])[1]}:${el.id}:${NARROW.matches ? 'm' : 'w'}`};
    if (kind === 'img') return {id: `${SALT}:${PAGE}:${BOOK}:p${el.dataset.p || new URLSearchParams(location.search).get('p') || 1}`};
    if (el.classList.contains('gc-month')) return {id: `${SALT}:${PAGE}:cal:${(el.closest('.gc-wrap') || {dataset: {}}).dataset.ink || ''}:${el.id}`};   // 일정표: 학생·달로 고정(내용이 바뀌어도 같은 카드)
    const sig = (el.textContent || '').length + '/' + el.querySelectorAll('[data-enc],img[src]').length, old = sigs.get(el);
    if (old && old.sig === sig) return old;
    // head = 첫머리(「3. 주제」처럼 번호+유형 두 글자, 번호가 없으면 24자), probes = 본문 가운데 두 토막. 채점으로 해설·정오 표시가 덧붙어도 토막은 남는다 → 같은 카드로 본다
    const n = norm(el), L = n.length, v = {sig, n, id: `${SALT}:${PAGE}:t:${hash(n)}:${NARROW.matches ? 'm' : 'w'}`, head: (n.match(/^\d+\s*[.)]\s*\S{0,2}/) || [n.slice(0, 24)])[0], probes: [n.substr(L / 3 | 0, 40), n.substr(2 * L / 3 | 0, 40)]};
    sigs.set(el, v); return v;
  }
  const same = (c, v) => c.probes.some(p => v.n.includes(p));
  const blank = (id, kind) => ({id, salt: SALT, page: PAGE, kind, w: 0, s: []});
  const tag = (c, v) => { c.sig = v.sig; c.head = v.head || ''; c.probes = v.probes || ['']; c.len = v.n ? v.n.length : 0; return c; };
  function mount(el, kind, q, v) { const c = tag(INK.mount(el, kind, q), v); cards.set(el, c); return c; }
  function unmount(c) { INK.unmount(c); cards.delete(c.el); }

  function sync() {
    stimer = 0; cand = candidates(); const gone = [];   // 같은 문항이 새로 그려지면(채점 뒤 다시 그리기) 필기를 넘겨준다
    for (const [el, c] of [...cards]) {
      if (cand.has(el) && el.isConnected && c.svg.parentNode === el) continue;
      if (c.kind === 'text' && c.q.s.length && c.len >= 40) gone.push(c);
      unmount(c);
    }
    let any = false;
    for (const [el, kind] of cand) {
      if (!any && vis(el)) any = true;
      const c = cards.get(el), v = ident(el, kind);
      if (c) {
        if (INK.busy()) continue;
        if (kind === 'img') { if (v.id !== c.q.id) INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); }
        else if (kind === 'text' && v.sig !== c.sig) { const keepIt = same(c, v); if (keepIt) c.sig = v.sig; else { INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); tag(c, v); } }   // 카드는 그대로인데 속 내용이 통째로 바뀐 경우
        continue;
      }
      let q = recs.get(v.id);
      if (!q && kind === 'text') { const g = gone.find(g => g.head === v.head && g.q.id !== v.id && g.probes.every(p => v.n.includes(p))); if (g) { q = {...g.q, id: v.id, s: g.q.s.map(s => ({...s, p: s.p.slice()}))}; save(q); } }
      if (q) mount(el, kind, q, v);
    }
    INK.bar(any);
  }
  const schedule = () => { if (!stimer) stimer = setTimeout(sync, 60); };
  const ours = n => n.nodeType === 1 && n.matches && n.matches(INKSEL);
  const mine = m => {
    const t = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (t && t.closest(INKSEL)) return true;
    if (m.type === 'childList') { const ns = [...m.addedNodes, ...m.removedNodes]; return ns.length > 0 && ns.every(ours); }
    return false;
  };
  new MutationObserver(ms => { if (!ms.every(mine)) schedule(); }).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'src']});
  addEventListener('hashchange', schedule); addEventListener('popstate', schedule);
  NARROW.addEventListener('change', async () => { await flush(); [...cards.values()].forEach(unmount); sync(); INK.status('이 방향에서 쓴 필기만 보입니다'); });

  INK.init({
    save: c => save(c.q), onPen: schedule,
    units() {   // 엔진이 두 손가락 확대로 키울 묶음(2판): 문항 목록(#qs·#exs)은 통째로, 그 밖은 카드 하나씩. 목록·현황·달력 화면은 묶음을 주지 않는다(= 브라우저 확대 그대로)
      const out = new Set();
      for (const [el] of cand) {
        if (!el.isConnected || !vis(el)) continue;
        if (!el.matches('.ink-page,.ink-text') && (el.classList.contains('gc-month') || el.closest('#view,#main'))) continue;
        const p = el.parentElement; out.add(p && (p.id === 'qs' || p.id === 'exs') ? p : el);
      }
      return [...out];
    },
    cardAt(t) {   // 펜이 닿은 자리의 카드 — 필기가 없던 카드는 이때 필기층을 만든다
      cand = candidates(); let el = null; for (let n = t; n && n !== document.body; n = n.parentElement) if (cand.has(n)) { el = n; break; }
      if (!el) return null;
      let c = cards.get(el); if (c && c.svg.parentNode !== el) { unmount(c); c = null; }
      if (!c) { const kind = cand.get(el), v = ident(el, kind); c = mount(el, kind, recs.get(v.id) || blank(v.id, kind), v); }
      return c;
    },
  });
  window.BOOKNOTE = {dump: () => tx('readonly', s => s.index('salt').getAll(SALT)), cards: () => cards.size};
  load().then(sync);
})();
</script>
</body>
</html>
