<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>World English 2 문법 능력평가</title>
<style>
:root{
  --bg:#f5f6f3; --card:#fff; --ink:#15181d; --dim:#5b6472; --line:#dfe3ea;
  --acc:#1d4ed8; --acc2:#eef2ff; --ok:#15803d; --ok2:#ecfdf5; --no:#b91c1c; --no2:#fef2f2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:19px;margin:0}
h1 small{display:block;font-size:13px;color:var(--dim);font-weight:400;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{flex:1;min-width:140px;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
button{font:inherit;font-weight:600;padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{background:#c7cdd8;cursor:default}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.small{padding:8px 12px;font-size:14px}
.muted{color:var(--dim);font-size:14px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.unit{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:12px;background:#fff;color:var(--ink);font-weight:600;text-align:left;cursor:pointer}
.unit .t{font-size:12.5px;color:var(--dim);font-weight:500}
.unit.on{border-color:var(--acc);background:var(--acc2)}
.unit.pass{border-color:var(--ok);background:var(--ok2)}
.unit .badge{font-size:12px;color:var(--ok);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(245,246,243,.95);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .wrap{padding:0;display:flex;gap:8px;align-items:center}
.bar button{flex:1}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.no{background:var(--acc);color:#fff;border-radius:999px;font-size:12.5px;font-weight:700;padding:2px 10px}
.tag{font-size:12.5px;color:var(--dim)}
.stem{font-family:'Times New Roman',Georgia,serif;font-size:19px;line-height:1.7;margin:2px 0 12px}
.stem u{text-decoration:none;border-bottom:2px solid var(--ink);padding:0 22px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  margin:6px 0;background:#fff;cursor:pointer;font-family:'Times New Roman',Georgia,serif;font-size:17px}
label.opt input{margin:4px 0 0}
label.opt.pick{border-color:var(--acc);background:var(--acc2)}
label.opt.right{border-color:var(--ok);background:var(--ok2)}
label.opt.wrong{border-color:var(--no);background:var(--no2)}
.mark{font-weight:700;font-size:14px;font-family:system-ui}
.mark.o{color:var(--ok)} .mark.x{color:var(--no)}
.ex{margin-top:8px;padding:10px 12px;background:#f8fafc;border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
  font-size:14px;color:#334155}
.big{text-align:center;padding:22px 16px}
.big .n{font-size:44px;font-weight:800;letter-spacing:-1px}
.big.pass .n{color:var(--ok)} .big.fail .n{color:var(--no)}
.big .m{font-size:15px;color:var(--dim);margin-top:4px}
pre.msg{white-space:pre-wrap;word-break:break-all;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;
  font-size:13px;font-family:ui-monospace,Menlo,monospace;margin:10px 0 0}
textarea{width:100%;min-height:120px;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:#f1f5f9}
.hide{display:none!important}
a.link{color:var(--acc);font-size:13px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header class="card" style="padding:14px 16px">
    <h1 id="appTitle"><small id="appSub"></small></h1>
  </header>

  <!-- ───────── 홈 ───────── -->
  <section id="home">
    <div class="card">
      <div class="row"><input type="text" id="name" placeholder="이름 (필수)" autocomplete="off"></div>
      <p class="muted" id="intro" style="margin:10px 0 0"></p>
    </div>
    <div class="card">
      <b>단원 선택</b> <span class="muted" id="passCount"></span>
      <div class="units" id="units"></div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <b>내 기록</b>
        <span><a class="link" id="toTeacher">교수님 화면</a> · <a class="link" id="resetAll">기록 지우기</a></span>
      </div>
      <div id="myLog" class="muted" style="margin-top:6px">아직 기록이 없습니다.</div>
    </div>
  </section>

  <!-- ───────── 시험 ───────── -->
  <section id="quiz" class="hide">
    <div class="card" style="padding:12px 16px">
      <b id="quizHead"></b><div class="muted" id="quizSub"></div>
    </div>
    <div id="qs"></div>
  </section>

  <!-- ───────── 결과 ───────── -->
  <section id="result" class="hide">
    <div class="card big" id="scoreCard"><div class="n" id="scoreN"></div><div class="m" id="scoreM"></div></div>
    <div class="card hide" id="certCard">
      <b>합격 메시지</b>
      <p class="muted" style="margin:6px 0 0">아래 내용을 교수님께 보내세요.</p>
      <pre class="msg" id="certMsg"></pre>
      <div class="row" style="margin-top:10px"><button class="small" id="copyCert">메시지 복사</button><span class="muted" id="copyMsg"></span></div>
    </div>
    <div id="review"></div>
  </section>

  <!-- ───────── 교수님 화면 ───────── -->
  <section id="teacher" class="hide">
    <div class="card">
      <b>학생이 보낸 합격 메시지를 붙여넣으세요</b>
      <p class="muted" style="margin:6px 0 8px">여러 건을 한꺼번에 붙여넣어도 됩니다. 코드가 맞는지 검사해 명단으로 만들어 줍니다.</p>
      <textarea id="paste" placeholder="[World English 2 문법 능력평가 합격] …"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="small" id="addPaste">명단에 넣기</button>
        <button class="small ghost" id="copyRoster">엑셀용으로 복사</button>
        <button class="small ghost" id="clearRoster">명단 비우기</button>
      </div>
      <div id="pasteMsg" class="muted" style="margin-top:6px"></div>
      <div id="rosterBox"></div>
    </div>
  </section>
</div>

<div class="bar"><div class="wrap" id="barIn"></div></div>

const $ = s => document.querySelector(s);
const el = (t, c, h) => { const x = document.createElement(t); if (c) x.className = c; if (h !== undefined) x.innerHTML = h; return x; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CIRC = ['(A)', '(B)', '(C)', '(D)'];
const PASS = D.pass;                                  // 합격에 필요한 정답 수 (= 문제 수)
const N = D.per;                                      // 한 회 문제 수
Object.entries(D.items).forEach(([n, arr]) => arr.forEach(it => it.u = +n));   // 문항마다 출처 단원
const rangeOf = u => D.units.filter(x => x.n <= u).map(x => x.n);              // 누적 범위: Unit 1 ~ 선택 단원
const rangeLabel = u => u === 1 ? 'Unit 1' : `Unit 1~${u}`;

/* ── 저장소: 접두 we2g: — 다른 앱과 섞이지 않는다 ───────────────────── */
const KEY = 'we2g:' + D.salt + ':';
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(KEY + k); } catch (e) {} },
};
const seenOf = u => new Set(store.get('seen' + u, []));
const passOf = () => store.get('pass', {});
const logOf = () => store.get('log', []);

/* ── 도구 ───────────────────────────────────────────────────────── */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const frameOf = id => id.replace(/[a-z]$/, '');        // U7A-06c → U7A-06 (같은 틀의 변형)
function hash8(s) {                                    // 합격 코드용 간단 해시
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < s.length; i++) { h1 = (h1 ^ s.charCodeAt(i)) * 16777619 >>> 0; h2 = (h2 + s.charCodeAt(i) * (i + 7)) >>> 0; }
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '', v = (h1 ^ h2) >>> 0, w = (h1 + h2) >>> 0;
  for (let i = 0; i < 4; i++) { out += abc[v % 32]; v = Math.floor(v / 32); }
  out += '-';
  for (let i = 0; i < 4; i++) { out += abc[w % 32]; w = Math.floor(w / 32); }
  return out;
}
const stamp = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} `
  + `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

/* ── 출제: 누적 범위 — 오늘 단원 2문제(Lesson A·C 각 1) + 이전 단원 3문제 ───── */
function makeRound(u) {
  const key = 'seen' + u;                              // 출제 기록은 「Unit u 시험」 단위로 쌓인다
  const seen = new Set(store.get(key, []));
  const picked = [], usedFrame = new Set();
  let recycled = false;
  const take = (cands, want) => {                       // cands 중에서 want개를 새 문항 우선으로
    let got = 0;
    if (want <= 0) return 0;                            // 이미 다 찼으면 소진 판정을 내리지 않는다
    const grab = pool => {
      for (const it of shuffle(pool)) {
        if (got >= want || picked.length >= N) return;
        picked.push(it); usedFrame.add(frameOf(it.id)); got++;
      }
    };
    grab(cands.filter(it => !seen.has(it.id) && !usedFrame.has(frameOf(it.id))));
    if (got < want) {                                   // 이 갈래의 새 문항이 떨어졌다 → 그 갈래 기록만 비운다
      cands.forEach(it => seen.delete(it.id)); recycled = true;
      grab(cands.filter(it => !usedFrame.has(frameOf(it.id)) && !picked.includes(it)));
    }
    if (got < want) grab(cands.filter(it => !picked.includes(it)));   // 끝자락이면 같은 틀이라도 채운다
    return got;
  };
  const today = D.items[u], prev = rangeOf(u).filter(n => n !== u);
  if (!prev.length) {                                   // Unit 1 시험 — 범위가 그 단원뿐
    take(today.filter(x => x.part === 'A'), 2 + Math.round(Math.random()));
    take(today.filter(x => x.part === 'C'), N - picked.length);
  } else {
    take(today.filter(x => x.part === 'A'), 1);         // 오늘 배운 문법 2문제는 반드시 낸다
    take(today.filter(x => x.part === 'C'), 1);
    take(today, 2 - picked.length);
    const order = shuffle(prev);                        // 이전 단원은 돌아가며 한 문제씩
    for (let i = 0; picked.length < N && i < order.length * 4; i++) take(D.items[order[i % order.length]], 1);
  }
  take(rangeOf(u).flatMap(n => D.items[n]), N - picked.length);   // 최후 보루 — N문제를 보장
  picked.forEach(it => seen.add(it.id));                // 나온 문제는 이 시험에서 다시 나오지 않는다
  store.set(key, [...seen]);
  const qs = shuffle(picked).slice(0, N).map(it => {
    const perm = shuffle([0, 1, 2, 3]);
    return { id: it.id, u: it.u, part: it.part, point: it.point, q: it.q, ex: it.ex,
             opts: perm.map(i => it.opts[i]), ans: perm.indexOf(it.ans), pick: null };
  });
  balance(qs);
  return { unit: u, qs, recycled, t0: Date.now() };
}
function balance(qs) {                                 // 정답 자리 쏠림 막기(같은 자리 최대 2개)
  const cap = Math.ceil(qs.length / 4) + 1;
  for (let pass = 0; pass < 8; pass++) {
    const h = [0, 0, 0, 0]; qs.forEach(q => h[q.ans]++);
    const hi = h.indexOf(Math.max(...h)), lo = h.indexOf(Math.min(...h));
    if (h[hi] <= cap) break;
    const q = qs.find(x => x.ans === hi);
    [q.opts[hi], q.opts[lo]] = [q.opts[lo], q.opts[hi]]; q.ans = lo;
  }
}

/* ── 화면 ───────────────────────────────────────────────────────── */
let cur = null, view = 'home';
function show(v) {
  view = v;
  ['home', 'quiz', 'result', 'teacher'].forEach(x => $('#' + x).classList.toggle('hide', x !== v));
  window.scrollTo(0, 0); bar();
}
function bar() {
  const b = $('#barIn'); b.innerHTML = '';
  if (view === 'home') {
    const go = el('button', '', '시험 시작'); go.id = 'go'; go.disabled = !(store.get('unit', 0) && $('#name').value.trim());
    go.onclick = start; b.append(go);
  } else if (view === 'quiz') {
    const n = cur.qs.filter(q => q.pick !== null).length;
    const g = el('button', '', `채점하기 (${n}/${cur.qs.length} 답함)`); g.disabled = n < cur.qs.length; g.onclick = grade;
    const h = el('button', 'ghost small', '그만두기'); h.onclick = () => { if (confirm('이번 회차를 그만둘까요? 나온 문제는 다시 나오지 않습니다.')) show('home'); };
    b.append(g, h);
  } else if (view === 'result') {
    if (cur.passed) {
      const h = el('button', '', '홈으로'); h.onclick = () => { home(); show('home'); };
      b.append(h);
    } else {
      const r = el('button', '', '새 문제로 다시 풀기'); r.onclick = () => { cur = makeRound(cur.unit); paint(); show('quiz'); };
      const h = el('button', 'ghost small', '홈으로'); h.onclick = () => { home(); show('home'); };
      b.append(r, h);
    }
  } else {
    const h = el('button', 'ghost', '홈으로'); h.onclick = () => { home(); show('home'); };
    b.append(h);
  }
}

function home() {
  const pass = passOf(), box = $('#units'); box.innerHTML = '';
  const sel = store.get('unit', 0);
  const only = D.only;                                  // ?u=N 으로 고정된 단원
  D.units.forEach(u => {
    if (only && u.n !== only) return;
    const p = pass[u.n];
    const b = el('button', 'unit' + (p ? ' pass' : '') + (sel === u.n ? ' on' : ''),
      `Unit ${u.n} ${p ? '<span class="badge">✓ 합격</span>' : ''}<span class="t">${esc(u.title)}</span><span class="t">범위 ${rangeLabel(u.n)}</span>`);
    b.onclick = () => { store.set('unit', u.n); home(); bar(); };
    box.append(b);
  });
  const done = Object.keys(pass).length;
  $('#passCount').textContent = `· 합격 ${done} / ${D.units.length}단원`;
  const log = logOf();
  $('#myLog').innerHTML = log.length ? '<table><tr><th>단원</th><th>회차</th><th>결과</th><th>시각</th></tr>'
    + log.slice(-12).reverse().map(r => `<tr><td>U${r.u}</td><td>${r.try}회</td>`
      + `<td style="color:${r.pass ? 'var(--ok)' : 'var(--no)'}">${r.pass ? '합격' : r.score + '/' + N}</td><td>${r.at}</td></tr>`).join('')
    + '</table>' : '아직 기록이 없습니다.';
  bar();
}

function start() {
  const nm = $('#name').value.trim();
  if (!nm) return;
  store.set('name', nm);
  const u = store.get('unit', 0); if (!u) return;
  cur = makeRound(u); paint(); show('quiz');
}

function paint() {
  const u = D.units.find(x => x.n === cur.unit);
  $('#quizHead').textContent = `Unit ${u.n} ${u.title} — 문법 능력평가`;
  const tries = (store.get('try' + cur.unit, 0)) + 1;
  $('#quizSub').innerHTML = `${tries}회차 · ${cur.qs.length}문제 · <b>${PASS}문제 모두 맞혀야 합격</b>`
    + (cur.recycled ? ' · <span style="color:var(--no)">새 문제가 모자라 앞서 나온 문제도 섞입니다</span>' : '')
    + `<br><span class="muted">범위 <b>${rangeLabel(cur.unit)}</b>`
    + (cur.unit > 1 ? ` · 오늘 ${u.points.map(p => esc(p.point)).join(' · ')} 2문제 + 앞 단원 복습 ${N - 2}문제` : ` · ${u.points.map(p => esc(p.point)).join(' · ')}`)
    + '</span>';
  const box = $('#qs'); box.innerHTML = '';
  cur.qs.forEach((q, i) => {

      c.append(lb);

    c.append(el('div', 'ex hide'));
    box.append(c);

function grade() {

  cur.passed = score >= PASS;
  const u = cur.unit;
  const tries = (store.get('try' + u, 0)) + 1; store.set('try' + u, tries);
  const at = stamp(new Date());
  const log = logOf(); log.push({ u, try: tries, score, pass: cur.passed, at }); store.set('log', log.slice(-200));
  if (cur.passed) { const p = passOf(); p[u] = { at, tries }; store.set('pass', p); store.del('seen' + u); }

  const title = D.units.find(x => x.n === u).title;
  $('#scoreCard').className = 'card big ' + (cur.passed ? 'pass' : 'fail');
  $('#scoreN').textContent = cur.passed ? '합격' : `${score} / ${cur.qs.length}`;
  $('#scoreM').innerHTML = cur.passed
    ? `Unit ${u} ${esc(title)} · ${cur.qs.length}문제 모두 정답 · ${tries}회차`

  $('#certCard').classList.toggle('hide', !cur.passed);
  if (cur.passed) {
    const nm = store.get('name', '');
    const base = `${nm}|${u}|${tries}|${at}|${D.salt}`;
    $('#certMsg').textContent = `[${D.title} 합격]\n이름: ${nm}\n단원: Unit ${u} ${title}\n범위: ${rangeLabel(u)}\n`

      + `결과: ${cur.qs.length}문제 모두 정답 (${tries}회차)\n시각: ${at}\n인증: ${hash8(base)}`;
  }

  const rv = $('#review'); rv.innerHTML = '';
  cur.qs.forEach((q, i) => {
    const ok = q.pick === q.ans;
    const c = el('div', 'q');
    c.append(el('div', 'qh', `<span class="no">${i + 1}</span><span class="mark ${ok ? 'o' : 'x'}">${ok ? '○ 정답' : '✕ 오답'}</span>`
      + `<span class="tag">U${q.u} ${esc(q.point)}</span>`));
    c.append(el('div', 'stem', esc(q.q).replace(/_{3,}/, '<u></u>')));
    q.opts.forEach((o, k) => {
      const cls = k === q.ans ? 'opt right' : (k === q.pick ? 'opt wrong' : 'opt');
      c.append(el('label', cls, `<span>${CIRC[k]} ${esc(o)}</span>`));
    });
    c.append(el('div', 'ex', '▸ ' + esc(q.ex)));
    rv.append(c);
  });
  show('result');
}

/* ── 교수님 화면 ─────────────────────────────────────────────────── */
function teacher() {
  show('teacher'); roster();
}
function roster() {
  const r = store.get('roster', []);
  $('#rosterBox').innerHTML = r.length
    ? '<table><tr><th>이름</th><th>단원</th><th>회차</th><th>시각</th><th>확인</th></tr>'
      + r.map(x => `<tr><td>${esc(x.name)}</td><td>U${x.unit}</td><td>${x.tries}회</td><td>${esc(x.at)}</td>`
        + `<td style="color:${x.ok ? 'var(--ok)' : 'var(--no)'}">${x.ok ? '확인' : '코드 불일치'}</td></tr>`).join('') + '</table>'
    : '<p class="muted" style="margin:10px 0 0">아직 명단이 비어 있습니다.</p>';
}
function addPaste() {
  const txt = $('#paste').value;
  const blocks = txt.split(/\n(?=\[)/).filter(b => b.includes('이름:'));
  const r = store.get('roster', []); let add = 0, dup = 0, bad = 0;
  for (const b of blocks) {
    const g = s => (b.match(new RegExp(s)) || [])[1] || '';
    const name = g('이름:\\s*(.+)').trim();
    const unit = +g('단원:\\s*Unit\\s*(\\d+)');
    const tries = +g('\\((\\d+)회차\\)');
    const at = g('시각:\\s*(.+)').trim();
    const code = g('인증:\\s*([A-Z0-9-]+)').trim();
    if (!name || !unit) { bad++; continue; }
    const ok = code === hash8(`${name}|${unit}|${tries}|${at}|${D.salt}`);
    if (r.some(x => x.name === name && x.unit === unit && x.at === at)) { dup++; continue; }
    r.push({ name, unit, tries, at, ok }); add++;
  }
  store.set('roster', r); roster();
  $('#pasteMsg').textContent = `${add}건 추가 · 중복 ${dup}건 건너뜀 · 읽지 못한 것 ${bad}건`;
  $('#paste').value = '';
}

/* ── 시작 ───────────────────────────────────────────────────────── */
$('#appTitle').insertAdjacentText('afterbegin', D.title);
$('#appSub').textContent = D.sub;
document.title = D.title;
$('#intro').innerHTML = `그날 배운 단원을 고르면 <b>그 단원까지가 시험 범위</b>입니다(Unit 3 → Unit 1~3). `
  + `한 회 <b>${N}문제</b>(오늘 단원 2문제 + 앞 단원 복습 ${N - 2}문제)를 풀어 <b>${PASS}문제 모두 맞혀야 합격</b>이고, `
  + `합격하지 못하면 <b>앞서 나오지 않은 새 문제</b>로 다시 풉니다.`;
$('#name').value = store.get('name', '');
$('#name').oninput = bar;
$('#toTeacher').onclick = teacher;
$('#resetAll').onclick = () => {
  if (!confirm('이 기기에 저장된 내 합격·출제 기록을 모두 지울까요?')) return;
  Object.keys(localStorage).filter(k => k.startsWith(KEY) && !k.endsWith('roster')).forEach(k => localStorage.removeItem(k));
  home();
};
$('#addPaste').onclick = addPaste;
$('#clearRoster').onclick = () => { if (confirm('명단을 비울까요?')) { store.set('roster', []); roster(); } };
$('#copyRoster').onclick = async () => {
  const r = store.get('roster', []);
  const t = [['이름', '단원', '회차', '시각', '확인'].join('\t'),
             ...r.map(x => [x.name, 'U' + x.unit, x.tries, x.at, x.ok ? '확인' : '코드 불일치'].join('\t'))].join('\n');
  try { await navigator.clipboard.writeText(t); $('#pasteMsg').textContent = `${r.length}건을 복사했습니다.`; }
  catch (e) { $('#pasteMsg').textContent = '복사가 막혀 있습니다. 표를 직접 선택해 복사하세요.'; }
};
$('#copyCert').onclick = async () => {
  try { await navigator.clipboard.writeText($('#certMsg').textContent); $('#copyMsg').textContent = '복사했습니다.'; }
  catch (e) { $('#copyMsg').textContent = '복사가 막혀 있습니다. 길게 눌러 선택하세요.'; }
};
const qp = new URLSearchParams(location.search);
D.only = +qp.get('u') || 0;                              // ?u=7 → 그 단원만
if (D.only && D.units.some(u => u.n === D.only)) store.set('unit', D.only); else D.only = 0;
home(); show('home');
</script>
